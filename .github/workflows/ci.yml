name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # O onnxruntime-node (dependência do @huggingface/transformers) baixa no install um binário de GPU (CUDA)
      # que hoje responde 404 no GitHub e derruba o npm ci. O CI não usa GPU: pula esse download.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      # Cypress fica de fora por enquanto: precisaria da stack completa (backend + Postgres)
      # rodando no runner, escopo maior que o resto deste workflow.
